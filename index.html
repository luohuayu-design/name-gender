<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="./manifest.json">
<title>姓名性别判断</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(165deg, #e8f0fe 0%, #f0f2f5 45%, #f7f8fa 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1c1e21;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .page { width: 100%; max-width: 460px; }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 1px;
  }
  .sub {
    margin: 6px 0 0;
    color: #8a8d91;
    font-size: 14px;
    line-height: 1.5;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 6px 24px rgba(24, 119, 242, 0.10);
  }

  .input-row { display: flex; gap: 10px; }
  #name {
    flex: 1;
    min-width: 0;
    height: 50px;
    min-height: 50px;
    max-height: 140px;
    padding: 12px 16px;
    font-size: 18px;
    line-height: 24px;
    font-family: inherit;
    border: 1.5px solid #e4e6eb;
    border-radius: 12px;
    outline: none;
    background: #f7f8fa;
    resize: none;
    overflow-y: auto;
    transition: border-color .2s, background .2s;
  }
  #name:focus { border-color: #1877f2; background: #fff; }
  #go {
    flex: 0 0 auto;
    height: 50px;
    padding: 0 22px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a9bff, #1877f2);
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  #go:active { transform: scale(0.96); }
  #go:disabled { opacity: .45; cursor: default; }

  .status { margin-top: 14px; font-size: 14px; color: #8a8d91; min-height: 20px; }
  .status.err { color: #e5484d; }
  .status.ok { color: #1a9c5b; }

  .result { margin-top: 18px; display: none; }
  .result.show { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .gender {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 6px;
    text-align: center;
    line-height: 1.2;
  }
  .gender.male { color: #1877f2; }
  .gender.female { color: #ff5c8a; }
  .gender.neutral { color: #8a8d91; font-size: 34px; letter-spacing: 4px; }
  .gender.unknown { color: #8a8d91; font-size: 28px; letter-spacing: 2px; }

  .prob-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    color: #65676b;
  }
  .bar {
    display: flex;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: #e4e6eb;
    margin: 8px 0 4px;
  }
  .bar i { display: block; height: 100%; transition: width .45s ease; }
  .bar .m { background: linear-gradient(90deg, #6aa9ff, #1877f2); }
  .bar .f { background: linear-gradient(90deg, #ffa7c1, #ff5c8a); }

  .meta { margin-top: 14px; font-size: 13px; color: #65676b; line-height: 1.7; }
  .meta b { color: #1c1e21; font-weight: 600; }
  .warn { margin-top: 10px; font-size: 13px; color: #b26a00; background: #fff8e1; border-radius: 8px; padding: 8px 12px; }
  .warn:empty { display: none; }

  .history { margin-top: 16px; }
  .history-title { font-size: 13px; color: #65676b; margin-bottom: 8px; }
  #historyList { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 0;
    background: #eef3ff;
    color: #1877f2;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip:active { transform: scale(0.96); }

  /* 字符贡献 */
  .contrib { margin-top: 14px; display: none; }
  .contrib.show { display: block; }
  .contrib-title { font-size: 13px; color: #65676b; margin-bottom: 6px; }
  .contrib-note { font-size: 12px; color: #a1a5aa; line-height: 1.6; margin-bottom: 4px; }
  .contrib-sub { font-size: 12px; color: #65676b; margin: 10px 0 2px; }
  .ct-ch.pair { width: 52px; font-size: 13px; }
  .ct-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
  .ct-ch { flex: 0 0 auto; width: 20px; text-align: center; font-weight: 600; font-size: 15px; }
  .ct-track { position: relative; flex: 1; height: 10px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
  .ct-track::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #cfd3d8; }
  .ct-fill { position: absolute; top: 0; bottom: 0; border-radius: 999px; }
  .ct-fill.m { background: linear-gradient(90deg, #6aa9ff, #1877f2); }
  .ct-fill.f { background: linear-gradient(90deg, #ffa7c1, #ff5c8a); }
  .ct-val { flex: 0 0 auto; width: 52px; text-align: right; color: #65676b; font-variant-numeric: tabular-nums; }

  /* 批量结果 */
  .batch { margin-top: 18px; display: none; }
  .batch.show { display: block; }
  .batch-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .batch-summary { font-size: 13px; color: #65676b; line-height: 1.5; }
  #csvBtn {
    flex: 0 0 auto;
    border: 1px solid #cfe0ff;
    background: #eef3ff;
    color: #1877f2;
    font-size: 13px;
    font-family: inherit;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  #csvBtn:active { transform: scale(0.96); }
  .batch-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
  .brow {
    display: grid;
    grid-template-columns: 1fr auto 78px 30px;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 0;
    background: #f7f8fa;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    color: #1c1e21;
    text-align: left;
    cursor: pointer;
  }
  .brow:active { transform: scale(0.99); }
  .brow:disabled { cursor: default; opacity: .75; }
  .bname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btag { font-size: 12px; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .btag.male { background: #e7f0ff; color: #1877f2; }
  .btag.female { background: #ffe9f0; color: #ff5c8a; }
  .btag.neutral { background: #eceef1; color: #8a8d91; }
  .btag.err { background: #fdecec; color: #e5484d; }
  .bprob { font-size: 13px; color: #65676b; text-align: right; font-variant-numeric: tabular-nums; }
  .bconf { font-size: 12px; color: #a1a5aa; text-align: right; }
  .bdetail { padding: 0 12px 6px; }

  .footer {
    margin-top: 22px;
    font-size: 12px;
    color: #a1a5aa;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>姓名性别判断</h1>
    <p class="sub">输入中文姓名，小模型给出性别判断和概率；也可以一次粘贴多个名字。</p>

    <div class="card">
      <div class="input-row">
        <textarea id="name" rows="1" maxlength="2000" autocomplete="off"
                  enterkeyhint="search"
                  placeholder="例如：张伟，可粘贴多个名字（逗号 / 空格 / 换行分隔）"></textarea>
        <button id="go" disabled>判断</button>
      </div>

      <div id="status" class="status">正在加载模型 ...</div>

      <div id="result" class="result">
        <div id="gender" class="gender unknown">--</div>
        <div class="prob-labels">
          <span id="maleLabel">男性 --</span>
          <span id="femaleLabel">女性 --</span>
        </div>
        <div class="bar">
          <i id="maleBar" class="m" style="width:0%"></i>
          <i id="femaleBar" class="f" style="width:100%"></i>
        </div>
        <div id="meta" class="meta"></div>
        <div id="warn" class="warn"></div>
        <div id="contrib" class="contrib"></div>
      </div>

      <div id="batch" class="batch">
        <div class="batch-head">
          <div id="batchSummary" class="batch-summary"></div>
          <button id="csvBtn" type="button">导出 CSV</button>
        </div>
        <div id="batchList" class="batch-list"></div>
      </div>
    </div>

    <div id="history" class="history" style="display:none">
      <div class="history-title">最近查询</div>
      <div id="historyList"></div>
    </div>

    <div class="footer">
      3 模型集成 · 每个 237 万参数 · 字向量 128 维 · 位置特征 · 人名词典<br>
      支持批量判断、CSV 导出与字符贡献分析<br>
      结果仅供参考，中性名字本身就没有固定答案<br>
      v4.5 · 2026-11-23
    </div>
  </div>

<script>
'use strict';

const MODEL_VERSION = '4.2';
let model = null;
const charToId = new Map();

const inputEl = document.getElementById('name');
const goEl = document.getElementById('go');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

// 加载模型：文件名带版本号，同一版本走缓存，发版后自动换新
function loadModel() {
  return fetch('./model.json?v=' + MODEL_VERSION)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = Number(r.headers.get('Content-Length') || 0);
      if (!r.body || !r.body.getReader) return r.json();
      const reader = r.body.getReader();
      const chunks = [];
      let received = 0;
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            const buf = new Uint8Array(received);
            let off = 0;
            for (let i = 0; i < chunks.length; i++) {
              buf.set(chunks[i], off);
              off += chunks[i].length;
            }
            return JSON.parse(new TextDecoder().decode(buf));
          }
          chunks.push(res.value);
          received += res.value.length;
          const mb = (received / 1048576).toFixed(1);
          statusEl.textContent = total
            ? '正在加载模型 ' + Math.min(99, Math.round(received / total * 100)) + '%（' + mb + ' MB）'
            : '正在加载模型 ' + mb + ' MB';
          return pump();
        });
      }
      return pump();
    });
}

loadModel()
  .then(function (m) {
    model = m;
    m.vocab.forEach(function (ch, i) { charToId.set(ch, i); });
    // int8 权重还原成浮点（体积小、加载快）
    const V = m.vocab.length, H = m.hidden, NB = m.buckets;
    m._models = m.models.map(function (mm) {
      const bin = atob(mm.w1);
      const W1 = new Float32Array((V + NB) * H);
      for (let i = 0; i < W1.length; i++) {
        let v = bin.charCodeAt(i);
        if (v > 127) v -= 256;
        W1[i] = v * mm.scale;
      }
      return { alpha: mm.alpha, beta: mm.beta, gamma: mm.gamma, B1: mm.B1, W2: mm.W2, B2: mm.B2, W1: W1 };
    });
    statusEl.textContent = '模型已就绪，输入或粘贴名字试试';
    statusEl.className = 'status ok';
    goEl.disabled = false;
  })
  .catch(function () {
    statusEl.textContent = '模型加载失败，请刷新页面重试';
    statusEl.className = 'status err';
  });

// 注册 Service Worker，支持离线打开
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}

// 与 train.js 完全一致的复姓表
const COMPOUND_SURNAMES = new Set([
  '欧阳', '太史', '端木', '上官', '司马', '东方', '独孤', '南宫', '万俟', '闻人',
  '夏侯', '诸葛', '尉迟', '公羊', '赫连', '澹台', '皇甫', '宗政', '濮阳', '公冶',
  '太叔', '申屠', '公孙', '慕容', '仲孙', '钟离', '长孙', '宇文', '司徒', '鲜于',
  '司空', '闾丘', '子车', '亓官', '司寇', '巫马', '公西', '颛孙', '壤驷', '公良',
  '漆雕', '乐正', '宰父', '谷梁', '拓跋', '夹谷', '轩辕', '令狐', '段干', '百里',
  '呼延', '东郭', '南门', '羊舌', '微生', '公户', '公玉', '公仪', '梁丘', '公仲',
  '公上', '公门', '公山', '公坚', '左丘', '公伯', '西门', '公祖', '第五', '公乘',
  '贯丘', '公皙', '南荣', '东里', '东宫', '仲长', '子书', '子桑', '即墨', '达奚',
  '褚师'
]);

function splitName(chars) {
  if (chars.length >= 3 && COMPOUND_SURNAMES.has(chars[0] + chars[1])) {
    return { surname: chars.slice(0, 2), given: chars.slice(2) };
  }
  if (chars.length >= 2) {
    return { surname: chars.slice(0, 1), given: chars.slice(1) };
  }
  return { surname: [], given: chars.slice() };
}

// 双字特征哈希，必须与 train.js / predict.js 完全一致
function bigramBucket(c1, c2) {
  const a = c1.charCodeAt(0);
  const b = c2.charCodeAt(0);
  let h = Math.imul(a, 73856093) ^ Math.imul(b, 19349663);
  h = h >>> 0;
  return h % model.buckets;
}

// 位置标记（与 train.js 一致）
const POS_TAGS = [0, 1, 2].map(function (k) { return String.fromCharCode(0xe000 + k); });

// 把姓名拆成三通道特征：姓 / 名（含位置）/ 跨界的搭配
function featurize(chars) {
  const parts = splitName(chars);
  const surname = parts.surname;
  const given = parts.given;
  const su = [], sB = [], gu = [], gB = [];
  for (const ch of surname) if (charToId.has(ch)) su.push(charToId.get(ch));
  for (let k = 0; k + 1 < surname.length; k++) sB.push(bigramBucket(surname[k], surname[k + 1]));
  for (const ch of given) if (charToId.has(ch)) gu.push(charToId.get(ch));
  for (let k = 0; k + 1 < given.length; k++) gB.push(bigramBucket(given[k], given[k + 1]));

  // 位置特征：名里的字带上「首 / 中 / 尾」标记
  const L = given.length;
  for (let k = 0; k < L; k++) {
    if (L === 1) {
      gB.push(bigramBucket(given[k], POS_TAGS[0]));
      gB.push(bigramBucket(given[k], POS_TAGS[2]));
    } else if (k === 0) {
      gB.push(bigramBucket(given[k], POS_TAGS[0]));
    } else if (k === L - 1) {
      gB.push(bigramBucket(given[k], POS_TAGS[2]));
    } else {
      gB.push(bigramBucket(given[k], POS_TAGS[1]));
    }
  }

  let cross = -1;
  if (surname.length && given.length) {
    cross = bigramBucket(surname[surname.length - 1], given[0]);
  }

  if (su.length + gu.length === 0) return null;
  return { su: su, sB: sB, gu: gu, gB: gB, cross: cross };
}

// 单个模型的前向，返回未除以温度的 logit
function forwardZ(M, f, V, H, xs, xg, xc) {
  xs.fill(0); xg.fill(0); xc.fill(0);

  for (const id of f.su) {
    const b = id * H;
    for (let j = 0; j < H; j++) xs[j] += M.W1[b + j];
  }
  for (const bk of f.sB) {
    const b = (V + bk) * H;
    for (let j = 0; j < H; j++) xs[j] += M.W1[b + j];
  }
  const ns = f.su.length + f.sB.length;
  if (ns) { const k = 1 / ns; for (let j = 0; j < H; j++) xs[j] *= k; }

  for (const id of f.gu) {
    const b = id * H;
    for (let j = 0; j < H; j++) xg[j] += M.W1[b + j];
  }
  for (const bk of f.gB) {
    const b = (V + bk) * H;
    for (let j = 0; j < H; j++) xg[j] += M.W1[b + j];
  }
  const ng = f.gu.length + f.gB.length;
  if (ng) { const k = 1 / ng; for (let j = 0; j < H; j++) xg[j] *= k; }

  if (f.cross >= 0) {
    const b = (V + f.cross) * H;
    for (let j = 0; j < H; j++) xc[j] = M.W1[b + j];
  }

  let z = M.B2;
  for (let j = 0; j < H; j++) {
    z += M.W2[j] * Math.tanh(M.alpha * xs[j] + M.beta * xg[j] + M.gamma * xc[j] + M.B1[j]);
  }
  return z;
}

// 多模型：概率取平均；logit 也取平均，供字符贡献使用
function scoreOf(chars) {
  const f = featurize(chars);
  if (!f) return null;
  const H = model.hidden;
  const V = model.vocab.length;
  const T = model.temperature || 1;
  const xs = new Float64Array(H);
  const xg = new Float64Array(H);
  const xc = new Float64Array(H);
  const models = model._models || [];
  let sz = 0, sp = 0;
  for (const M of models) {
    const z = forwardZ(M, f, V, H, xs, xg, xc);
    sz += z;
    sp += 1 / (1 + Math.exp(-z / T));
  }
  const k = models.length || 1;
  return { z: sz / k, p: sp / k };
}

function predict(name) {
  const chars = [];
  const unknown = [];
  for (const ch of name) {
    if (ch < '\u4e00' || ch > '\u9fa5') continue;
    chars.push(ch);
    if (!charToId.has(ch)) unknown.push(ch);
  }
  if (chars.length === 0) {
    return { error: '请输入中文姓名', unknown: unknown };
  }

  const parts = splitName(chars);
  const base = {
    chars: chars,
    known: chars.filter(function (ch) { return charToId.has(ch); }),
    unknown: unknown,
    surname: parts.surname.join(''),
    given: parts.given.join(''),
  };

  // 人名词典优先
  const key = chars.join('');
  if (Object.prototype.hasOwnProperty.call(model.dict || {}, key)) {
    const isMale = model.dict[key] === 1;
    return Object.assign({ p: isMale ? 0.95 : 0.05, source: '词典', dict: true }, base);
  }

  const s = scoreOf(chars);
  if (!s) return Object.assign({ error: '名字里的字模型都不认识' }, base);
  return Object.assign({ p: s.p, z: s.z, source: '模型' }, base);
}

// 所有「保留部分字」子集的名字概率；空集按 50% 算
function subsetProbs(chars) {
  const n = chars.length;
  const cache = new Map();
  function pOf(mask) {
    if (cache.has(mask)) return cache.get(mask);
    const sub = [];
    for (let i = 0; i < n; i++) if (mask & (1 << i)) sub.push(chars[i]);
    const s = sub.length ? scoreOf(sub) : null;
    const p = s ? s.p : 0.5;
    cache.set(mask, p);
    return p;
  }
  return { n: n, pOf: pOf };
}

// 单字贡献 = Shapley 值：该字在所有组合里的平均边际影响（百分点），
// 各字相加 = 最终男性概率 − 50%
function contributionsOf(chars) {
  const sub = subsetProbs(chars);
  const n = sub.n;
  if (n < 2) return [];

  const fact = [1];
  for (let i = 1; i <= n; i++) fact[i] = fact[i - 1] * i;

  const out = [];
  for (let i = 0; i < n; i++) {
    let v = 0;
    for (let mask = 0; mask < (1 << n); mask++) {
      if (mask & (1 << i)) continue;
      let k = 0;
      for (let m = mask; m; m &= m - 1) k++;
      const w = fact[k] * fact[n - k - 1] / fact[n];
      v += w * (sub.pOf(mask | (1 << i)) - sub.pOf(mask));
    }
    out.push({ ch: chars[i], dp: v * 100 });
  }
  return out;
}

// 相邻两字的组合贡献 = Shapley 交互指数：
// 两个字一起出现，比各自单独出现多出（或少掉）的男性概率，单位百分点
function interactionsOf(chars) {
  const sub = subsetProbs(chars);
  const n = sub.n;
  if (n < 2) return [];

  const fact = [1];
  for (let i = 1; i <= n; i++) fact[i] = fact[i - 1] * i;

  const out = [];
  for (let i = 0; i + 1 < n; i++) {
    const j = i + 1;
    const restMask = ((1 << n) - 1) & ~(1 << i) & ~(1 << j);
    let v = 0;
    let s = restMask;
    while (true) {
      let k = 0;
      for (let m = s; m; m &= m - 1) k++;
      const w = fact[k] * fact[n - k - 2] / fact[n - 1];
      const both = s | (1 << i) | (1 << j);
      const onlyI = s | (1 << i);
      const onlyJ = s | (1 << j);
      v += w * (sub.pOf(both) - sub.pOf(onlyI) - sub.pOf(onlyJ) + sub.pOf(s));
      if (s === 0) break;
      s = (s - 1) & restMask;
    }
    out.push({ pair: chars[i] + chars[j], v: v * 100 });
  }
  return out;
}

// 画字符贡献条：向右偏男，向左偏女
function renderContrib(box, chars) {
  box.textContent = '';
  box.classList.remove('show');
  if (!chars || chars.length < 2) return;

  const singles = contributionsOf(chars);
  let pairs = interactionsOf(chars);
  pairs = pairs.filter(function (it) { return Math.abs(it.v) >= 0.1; });

  let max = 0;
  for (const it of singles) max = Math.max(max, Math.abs(it.dp));
  for (const it of pairs) max = Math.max(max, Math.abs(it.v));
  if (!singles.length || max < 0.05) return;

  const title = document.createElement('div');
  title.className = 'contrib-title';
  title.textContent = '字符贡献（正 = 偏男，负 = 偏女）';
  box.appendChild(title);

  const note = document.createElement('div');
  note.className = 'contrib-note';
  note.textContent = '单字：Shapley 值，各字相加 = 最终概率 − 50%。';
  box.appendChild(note);

  function addRow(label, value, isPair) {
    const row = document.createElement('div');
    row.className = 'ct-row';

    const ch = document.createElement('span');
    ch.className = 'ct-ch' + (isPair ? ' pair' : '');
    ch.textContent = label;

    const track = document.createElement('span');
    track.className = 'ct-track';
    const fill = document.createElement('i');
    fill.className = 'ct-fill ' + (value >= 0 ? 'm' : 'f');
    fill.style.width = Math.max(2, Math.abs(value) / max * 50) + '%';
    if (value >= 0) fill.style.left = '50%';
    else fill.style.right = '50%';
    track.appendChild(fill);

    const val = document.createElement('span');
    val.className = 'ct-val';
    val.textContent = (value >= 0 ? '+' : '') + value.toFixed(1);

    row.appendChild(ch);
    row.appendChild(track);
    row.appendChild(val);
    box.appendChild(row);
  }

  for (const it of singles) addRow(it.ch, it.dp, false);

  if (pairs.length) {
    const sub = document.createElement('div');
    sub.className = 'contrib-sub';
    sub.textContent = '相邻两字组合（协同效应，不与上方相加）';
    box.appendChild(sub);

    for (const it of pairs) addRow(it.pair, it.v, true);

    const note2 = document.createElement('div');
    note2.className = 'contrib-note';
    note2.textContent = '组合 = Shapley 交互指数：正数表示两字一起出现比分开更偏男，负数相反。';
    box.appendChild(note2);
  }

  box.classList.add('show');
}

// 三分类：概率接近 0.5 时不给强结论
function verdictOf(p) {
  if (Math.abs(p - 0.5) < (model.neutral || 0.2)) return '中性';
  return p >= 0.5 ? '男' : '女';
}

function confidenceOf(p) {
  const d = Math.abs(p - 0.5) * 2;
  if (d >= 0.6) return '高';
  if (d >= 0.3) return '中';
  return '低';
}

const SEP_RE = /[\s,，、;；/|]+/;
const MAX_BATCH = 300;
let batchRows = null;

// 从输入框拆出多个名字（逗号 / 空格 / 换行等分隔，自动去重）
function parseNames(text) {
  const seen = new Set();
  const out = [];
  for (const raw of text.split(SEP_RE)) {
    const n = raw.trim();
    if (!n || seen.has(n)) continue;
    seen.add(n);
    out.push(n);
    if (out.length >= MAX_BATCH) break;
  }
  return out;
}

function showError(msg) {
  resultEl.classList.remove('show');
  document.getElementById('contrib').classList.remove('show');
  document.getElementById('batch').classList.remove('show');
  statusEl.textContent = msg;
  statusEl.className = 'status err';
}

function render() {
  const raw = inputEl.value.trim();
  if (!raw) {
    showError('请先输入姓名');
    return;
  }
  const names = parseNames(raw);
  if (!names.length) {
    showError('请先输入中文姓名');
    return;
  }
  if (names.length === 1) renderSingle(names[0]);
  else renderBatch(names);
}

function renderSingle(name) {
  const r = predict(name);
  if (r.error) {
    const extra = r.unknown && r.unknown.length ? '（不认识的字：' + r.unknown.join('、') + '）' : '';
    showError(r.error + extra);
    return;
  }

  document.getElementById('batch').classList.remove('show');
  statusEl.textContent = '';
  statusEl.className = 'status';

  const pMale = Math.min(99.9, Math.max(0.1, r.p * 100));
  const pFemale = 100 - pMale;
  const verdict = verdictOf(r.p);
  const conf = confidenceOf(r.p);

  const genderEl = document.getElementById('gender');
  genderEl.textContent = verdict === '中性' ? '中性' : verdict;
  genderEl.className = 'gender ' + (verdict === '中性' ? 'neutral' : (verdict === '男' ? 'male' : 'female'));

  document.getElementById('maleLabel').textContent = '男性 ' + pMale.toFixed(1) + '%';
  document.getElementById('femaleLabel').textContent = '女性 ' + pFemale.toFixed(1) + '%';
  document.getElementById('maleBar').style.width = pMale + '%';
  document.getElementById('femaleBar').style.width = pFemale + '%';

  const meta = document.getElementById('meta');
  meta.textContent = '';
  const b = document.createElement('b');
  b.textContent = '置信度：' + conf;
  meta.appendChild(b);
  meta.appendChild(document.createTextNode('　来源：' + r.source));
  meta.appendChild(document.createTextNode('　姓「' + (r.surname || '未识别') + '」名「' + (r.given || '—') + '」'));
  meta.appendChild(document.createTextNode('　识别到的字：' + r.known.join('、')));

  const warn = document.getElementById('warn');
  if (r.unknown.length) {
    warn.textContent = '模型不认识、已忽略：' + r.unknown.join('、');
  } else if (verdict === '中性') {
    warn.textContent = '这个名字男女都常见，模型不给强结论。';
  } else {
    warn.textContent = '';
  }

  // 词典命中的结果不画贡献（结果不是模型算出来的）
  renderContrib(document.getElementById('contrib'), r.dict ? null : r.chars);

  resultEl.classList.add('show');
  addHistory(name, verdict);
}

// 多个名字：列表 + 汇总 + 导出 CSV，点某一行展开字符贡献
function renderBatch(names) {
  const results = names.map(function (n) {
    const r = predict(n);
    r.name = n;
    return r;
  });
  batchRows = results;

  resultEl.classList.remove('show');
  document.getElementById('contrib').classList.remove('show');

  let male = 0, female = 0, neutral = 0, failed = 0;
  for (const r of results) {
    if (r.error) { failed++; continue; }
    const v = verdictOf(r.p);
    if (v === '男') male++;
    else if (v === '女') female++;
    else neutral++;
  }

  document.getElementById('batchSummary').textContent =
    '共 ' + results.length + ' 个名字 · 男 ' + male + ' · 女 ' + female + ' · 中性 ' + neutral +
    (failed ? ' · 无法判断 ' + failed : '');

  const list = document.getElementById('batchList');
  list.textContent = '';

  results.forEach(function (r) {
    const wrap = document.createElement('div');

    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'brow';

    const nameEl = document.createElement('span');
    nameEl.className = 'bname';
    nameEl.textContent = r.name;

    const tag = document.createElement('span');
    const probEl = document.createElement('span');
    probEl.className = 'bprob';
    const confEl = document.createElement('span');
    confEl.className = 'bconf';

    if (r.error) {
      tag.className = 'btag err';
      tag.textContent = '无法判断';
      row.disabled = true;
    } else {
      const v = verdictOf(r.p);
      tag.className = 'btag ' + (v === '男' ? 'male' : (v === '女' ? 'female' : 'neutral'));
      tag.textContent = v;
      probEl.textContent = '男 ' + (r.p * 100).toFixed(1) + '%';
      confEl.textContent = confidenceOf(r.p);
    }

    row.appendChild(nameEl);
    row.appendChild(tag);
    row.appendChild(probEl);
    row.appendChild(confEl);
    wrap.appendChild(row);

    // 点一行展开 / 收起字符贡献
    if (!r.error && !r.dict) {
      const detail = document.createElement('div');
      detail.className = 'bdetail contrib';
      wrap.appendChild(detail);
      let drawn = false;
      row.addEventListener('click', function () {
        if (!drawn) {
          renderContrib(detail, r.chars);
          drawn = true;
          return;
        }
        detail.classList.toggle('show');
      });
    }

    list.appendChild(wrap);
  });

  statusEl.textContent = '';
  statusEl.className = 'status ok';
  document.getElementById('batch').classList.add('show');
}

function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// 导出批量结果（带 BOM，Excel 打开不乱码）
function exportCsv() {
  if (!batchRows || !batchRows.length) return;
  const rows = [['姓名', '判定', '男性概率(%)', '女性概率(%)', '置信度', '来源/说明']];
  for (const r of batchRows) {
    if (r.error) {
      rows.push([r.name, '无法判断', '', '', '', r.error]);
    } else {
      rows.push([
        r.name,
        verdictOf(r.p),
        (r.p * 100).toFixed(1),
        ((1 - r.p) * 100).toFixed(1),
        confidenceOf(r.p),
        r.source,
      ]);
    }
  }
  const text = '\uFEFF' + rows.map(function (cols) {
    return cols.map(csvCell).join(',');
  }).join('\r\n');

  const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '姓名性别判断结果.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
}

// ── 最近查询（只存在本机浏览器，不上传） ──
const HISTORY_KEY = 'name_gender_history';
const HISTORY_MAX = 10;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
}

function addHistory(name, verdict) {
  const list = loadHistory().filter(function (it) { return it.name !== name; });
  list.unshift({ name: name, v: verdict });
  saveHistory(list.slice(0, HISTORY_MAX));
  renderHistory();
}

function renderHistory() {
  const list = loadHistory();
  const box = document.getElementById('history');
  const wrap = document.getElementById('historyList');
  if (!list.length) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  wrap.textContent = '';
  list.forEach(function (it) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = it.name + ' · ' + (it.v || (it.p >= 0.5 ? '男' : '女'));
    chip.addEventListener('click', function () {
      inputEl.value = it.name;
      render();
    });
    wrap.appendChild(chip);
  });
}

renderHistory();

// 输入框随内容自动长高（最多 140px）
function autoGrow() {
  inputEl.style.height = 'auto';
  const h = Math.min(140, Math.max(50, inputEl.scrollHeight || 50));
  inputEl.style.height = h + 'px';
}

goEl.addEventListener('click', render);
document.getElementById('csvBtn').addEventListener('click', exportCsv);
inputEl.addEventListener('keydown', function (e) {
  // Enter 直接判断；Shift + Enter 换行（方便批量粘贴后逐个编辑）
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    render();
  }
});
inputEl.addEventListener('input', autoGrow);
