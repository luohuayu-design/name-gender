<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1877f2">
<link rel="manifest" href="./manifest.json">
<title>姓名性别判断</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(165deg, #e8f0fe 0%, #f0f2f5 45%, #f7f8fa 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1c1e21;
    display: flex;
    justify-content: center;
    padding: 28px 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .page { width: 100%; max-width: 460px; }

  h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 1px;
  }
  .sub {
    margin: 6px 0 0;
    color: #8a8d91;
    font-size: 14px;
    line-height: 1.5;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 6px 24px rgba(24, 119, 242, 0.10);
  }

  .input-row { display: flex; gap: 10px; }
  #name {
    flex: 1;
    min-width: 0;
    height: 50px;
    padding: 0 16px;
    font-size: 18px;
    border: 1.5px solid #e4e6eb;
    border-radius: 12px;
    outline: none;
    background: #f7f8fa;
    transition: border-color .2s, background .2s;
  }
  #name:focus { border-color: #1877f2; background: #fff; }
  #go {
    flex: 0 0 auto;
    height: 50px;
    padding: 0 22px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #4a9bff, #1877f2);
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  #go:active { transform: scale(0.96); }
  #go:disabled { opacity: .45; cursor: default; }

  .status { margin-top: 14px; font-size: 14px; color: #8a8d91; min-height: 20px; }
  .status.err { color: #e5484d; }
  .status.ok { color: #1a9c5b; }

  .result { margin-top: 18px; display: none; }
  .result.show { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .gender {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 6px;
    text-align: center;
    line-height: 1.2;
  }
  .gender.male { color: #1877f2; }
  .gender.female { color: #ff5c8a; }
  .gender.unknown { color: #8a8d91; font-size: 28px; letter-spacing: 2px; }

  .prob-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    color: #65676b;
  }
  .bar {
    display: flex;
    height: 12px;
    border-radius: 999px;
    overflow: hidden;
    background: #e4e6eb;
    margin: 8px 0 4px;
  }
  .bar i { display: block; height: 100%; transition: width .45s ease; }
  .bar .m { background: linear-gradient(90deg, #6aa9ff, #1877f2); }
  .bar .f { background: linear-gradient(90deg, #ffa7c1, #ff5c8a); }

  .meta { margin-top: 14px; font-size: 13px; color: #65676b; line-height: 1.7; }
  .meta b { color: #1c1e21; font-weight: 600; }
  .warn { margin-top: 10px; font-size: 13px; color: #b26a00; background: #fff8e1; border-radius: 8px; padding: 8px 12px; }
  .warn:empty { display: none; }

  .history { margin-top: 16px; }
  .history-title { font-size: 13px; color: #65676b; margin-bottom: 8px; }
  #historyList { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 0;
    background: #eef3ff;
    color: #1877f2;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .chip:active { transform: scale(0.96); }

  .footer {
    margin-top: 22px;
    font-size: 12px;
    color: #a1a5aa;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>姓名性别判断</h1>
    <p class="sub">输入中文姓名，小模型给出性别判断和概率。</p>

    <div class="card">
      <div class="input-row">
        <input id="name" type="text" maxlength="10" autocomplete="off"
               enterkeyhint="search" placeholder="例如：张伟">
        <button id="go" disabled>判断</button>
      </div>

      <div id="status" class="status">正在加载模型 ...</div>

      <div id="result" class="result">
        <div id="gender" class="gender unknown">--</div>
        <div class="prob-labels">
          <span id="maleLabel">男性 --</span>
          <span id="femaleLabel">女性 --</span>
        </div>
        <div class="bar">
          <i id="maleBar" class="m" style="width:0%"></i>
          <i id="femaleBar" class="f" style="width:100%"></i>
        </div>
        <div id="meta" class="meta"></div>
        <div id="warn" class="warn"></div>
      </div>
    </div>

    <div id="history" class="history" style="display:none">
      <div class="history-title">最近查询</div>
      <div id="historyList"></div>
    </div>

    <div class="footer">
      40.0 万参数小模型 · 姓/名/搭配三通道 · 测试准确率 99.7%<br>
      结果仅供参考，中性名字本身就没有固定答案<br>
      v3.1 · 2026-11-23
    </div>
  </div>

<script>
'use strict';

const MODEL_VERSION = '3.1';
let model = null;
const charToId = new Map();

const inputEl = document.getElementById('name');
const goEl = document.getElementById('go');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

// 加载模型：文件名带版本号，同一版本走缓存，发版后自动换新
function loadModel() {
  return fetch('./model.json?v=' + MODEL_VERSION)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = Number(r.headers.get('Content-Length') || 0);
      if (!r.body || !r.body.getReader) return r.json();
      const reader = r.body.getReader();
      const chunks = [];
      let received = 0;
      function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            const buf = new Uint8Array(received);
            let off = 0;
            for (let i = 0; i < chunks.length; i++) {
              buf.set(chunks[i], off);
              off += chunks[i].length;
            }
            return JSON.parse(new TextDecoder().decode(buf));
          }
          chunks.push(res.value);
          received += res.value.length;
          const mb = (received / 1048576).toFixed(1);
          statusEl.textContent = total
            ? '正在加载模型 ' + Math.min(99, Math.round(received / total * 100)) + '%（' + mb + ' MB）'
            : '正在加载模型 ' + mb + ' MB';
          return pump();
        });
      }
      return pump();
    });
}

loadModel()
  .then(function (m) {
    model = m;
    m.vocab.forEach(function (ch, i) { charToId.set(ch, i); });
    statusEl.textContent = '模型已就绪，输入名字试试';
    statusEl.className = 'status ok';
    goEl.disabled = false;
  })
  .catch(function () {
    statusEl.textContent = '模型加载失败，请刷新页面重试';
    statusEl.className = 'status err';
  });

// 注册 Service Worker，支持离线打开
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function () {});
}

// 与 train.js 完全一致的复姓表
const COMPOUND_SURNAMES = new Set([
  '欧阳', '太史', '端木', '上官', '司马', '东方', '独孤', '南宫', '万俟', '闻人',
  '夏侯', '诸葛', '尉迟', '公羊', '赫连', '澹台', '皇甫', '宗政', '濮阳', '公冶',
  '太叔', '申屠', '公孙', '慕容', '仲孙', '钟离', '长孙', '宇文', '司徒', '鲜于',
  '司空', '闾丘', '子车', '亓官', '司寇', '巫马', '公西', '颛孙', '壤驷', '公良',
  '漆雕', '乐正', '宰父', '谷梁', '拓跋', '夹谷', '轩辕', '令狐', '段干', '百里',
  '呼延', '东郭', '南门', '羊舌', '微生', '公户', '公玉', '公仪', '梁丘', '公仲',
  '公上', '公门', '公山', '公坚', '左丘', '公伯', '西门', '公祖', '第五', '公乘',
  '贯丘', '公皙', '南荣', '东里', '东宫', '仲长', '子书', '子桑', '即墨', '达奚',
  '褚师'
]);

function splitName(chars) {
  if (chars.length >= 3 && COMPOUND_SURNAMES.has(chars[0] + chars[1])) {
    return { surname: chars.slice(0, 2), given: chars.slice(2) };
  }
  if (chars.length >= 2) {
    return { surname: chars.slice(0, 1), given: chars.slice(1) };
  }
  return { surname: [], given: chars.slice() };
}

// 双字特征哈希，必须与 train.js / predict.js 完全一致
function bigramBucket(c1, c2) {
  const a = c1.charCodeAt(0);
  const b = c2.charCodeAt(0);
  let h = Math.imul(a, 73856093) ^ Math.imul(b, 19349663);
  h = h >>> 0;
  return h % model.buckets;
}

// 前向：姓 / 名 / 搭配三通道分别平均，再按模型学到的权重加权
function predict(name) {
  const chars = [];
  const unknown = [];
  for (const ch of name) {
    if (ch < '\u4e00' || ch > '\u9fa5') continue;
    chars.push(ch);
    if (!charToId.has(ch)) unknown.push(ch);
  }
  if (chars.length === 0) {
    return { error: '请输入中文姓名', unknown: unknown };
  }

  const parts = splitName(chars);
  const surname = parts.surname;
  const given = parts.given;

  const su = [], sB = [], gu = [], gB = [];
  for (const ch of surname) if (charToId.has(ch)) su.push(charToId.get(ch));
  for (let k = 0; k + 1 < surname.length; k++) sB.push(bigramBucket(surname[k], surname[k + 1]));
  for (const ch of given) if (charToId.has(ch)) gu.push(charToId.get(ch));
  for (let k = 0; k + 1 < given.length; k++) gB.push(bigramBucket(given[k], given[k + 1]));

  let cross = -1;
  if (surname.length && given.length) {
    cross = bigramBucket(surname[surname.length - 1], given[0]);
  }

  if (su.length + gu.length === 0) {
    return { error: '名字里的字模型都不认识', unknown: unknown };
  }

  const H = model.hidden;
  const V = model.vocab.length;
  const xs = new Float64Array(H);
  const xg = new Float64Array(H);
  const xc = new Float64Array(H);

  for (const id of su) {
    const base = id * H;
    for (let j = 0; j < H; j++) xs[j] += model.W1[base + j];
  }
  for (const bk of sB) {
    const base = (V + bk) * H;
    for (let j = 0; j < H; j++) xs[j] += model.W1[base + j];
  }
  const ns = su.length + sB.length;
  if (ns) { const k = 1 / ns; for (let j = 0; j < H; j++) xs[j] *= k; }

  for (const id of gu) {
    const base = id * H;
    for (let j = 0; j < H; j++) xg[j] += model.W1[base + j];
  }
  for (const bk of gB) {
    const base = (V + bk) * H;
    for (let j = 0; j < H; j++) xg[j] += model.W1[base + j];
  }
  const ng = gu.length + gB.length;
  if (ng) { const k = 1 / ng; for (let j = 0; j < H; j++) xg[j] *= k; }

  if (cross >= 0) {
    const base = (V + cross) * H;
    for (let j = 0; j < H; j++) xc[j] = model.W1[base + j];
  }

  let z = model.B2;
  for (let j = 0; j < H; j++) {
    z += model.W2[j] * Math.tanh(
      model.alpha * xs[j] + model.beta * xg[j] + model.gamma * xc[j] + model.B1[j]
    );
  }
  const T = model.temperature || 1;
  const p = 1 / (1 + Math.exp(-z / T));

  return {
    p: p,
    known: chars.filter(function (ch) { return charToId.has(ch); }),
    unknown: unknown,
    surname: surname.join(''),
    given: given.join('')
  };
}

function confidenceOf(p) {
  const d = Math.abs(p - 0.5) * 2;
  if (d >= 0.8) return '高';
  if (d >= 0.5) return '中';
  return '低';
}

function showError(msg) {
  resultEl.classList.remove('show');
  statusEl.textContent = msg;
  statusEl.className = 'status err';
}

function render() {
  const name = inputEl.value.trim();
  if (!name) {
    showError('请先输入姓名');
    return;
  }

  const r = predict(name);
  if (r.error) {
    const extra = r.unknown && r.unknown.length ? '（不认识的字：' + r.unknown.join('、') + '）' : '';
    showError(r.error + extra);
    return;
  }

  statusEl.textContent = '';
  statusEl.className = 'status';

  const pMale = Math.min(99.9, Math.max(0.1, r.p * 100));
  const pFemale = 100 - pMale;
  const isMale = r.p >= 0.5;
  const conf = confidenceOf(r.p);

  const genderEl = document.getElementById('gender');
  genderEl.textContent = isMale ? '男' : '女';
  genderEl.className = 'gender ' + (isMale ? 'male' : 'female');

  document.getElementById('maleLabel').textContent = '男性 ' + pMale.toFixed(1) + '%';
  document.getElementById('femaleLabel').textContent = '女性 ' + pFemale.toFixed(1) + '%';
  document.getElementById('maleBar').style.width = pMale + '%';
  document.getElementById('femaleBar').style.width = pFemale + '%';

  const meta = document.getElementById('meta');
  meta.textContent = '';
  const b = document.createElement('b');
  b.textContent = '置信度：' + conf;
  meta.appendChild(b);
  meta.appendChild(document.createTextNode('　姓「' + (r.surname || '未识别') + '」名「' + (r.given || '—') + '」'));
  meta.appendChild(document.createTextNode('　识别到的字：' + r.known.join('、')));

  const warn = document.getElementById('warn');
  warn.textContent = r.unknown.length ? '模型不认识、已忽略：' + r.unknown.join('、') : '';

  resultEl.classList.add('show');
  addHistory(name, r.p);
}

// ── 最近查询（只存在本机浏览器，不上传） ──
const HISTORY_KEY = 'name_gender_history';
const HISTORY_MAX = 10;

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(list) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
}

function addHistory(name, p) {
  const list = loadHistory().filter(function (it) { return it.name !== name; });
  list.unshift({ name: name, p: p });
  saveHistory(list.slice(0, HISTORY_MAX));
  renderHistory();
}

function renderHistory() {
  const list = loadHistory();
  const box = document.getElementById('history');
  const wrap = document.getElementById('historyList');
  if (!list.length) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  wrap.textContent = '';
  list.forEach(function (it) {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = it.name + ' · ' + (it.p >= 0.5 ? '男' : '女');
    chip.addEventListener('click', function () {
      inputEl.value = it.name;
      render();
    });
    wrap.appendChild(chip);
  });
}

renderHistory();

goEl.addEventListener('click', render);
inputEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') render();
});
</script>
</body>
</html>
